include opacity.conf
include accent.conf


# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# sem aviso ao fechar a janela
confirm_os_window_close 0

# Ctrl+C copia se houver texto selecionado (senão interrompe o comando); Ctrl+V cola
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Ctrl+Backspace apaga a palavra anterior
map ctrl+backspace send_text all \x17
